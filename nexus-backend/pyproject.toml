[project]
name = "nexus-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BeoGonzalez", email = "beo.gonzalez@duocuc.cl" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "langchain>=1.3.16",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
nexus-backend = "nexus_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
